service: admin

provider:
  name: aws
  region: us-east-1
  runtime: provided.al2
  environment:
    # Symfony environment variables
    APP_ENV: prod
    APP_SECRET: ${ssm:/admin/app-secret}
    DATABASE_URL: ${ssm:/admin/database-url}

plugins:
  - ./vendor/bref/bref

functions:
  website:
    handler: public/index.php
    timeout: 28 # in seconds (API Gateway has a timeout of 29 seconds)
    layers:
      - ${bref:layer.php-81-fpm}
    events:
      - http: 'ANY /'
      - http: 'ANY /{proxy+}'
    vpc:
      securityGroupIds:
        - sg-3adb9b47
      subnetIds:
        - subnet-718df438
        - subnet-2540c37e
        - subnet-061bba3a
        - subnet-d20d83ff
        - subnet-cc1991c0
        - subnet-2a016e4f
  console:
    handler: bin/console
    timeout: 120 # in seconds
    layers:
      - ${bref:layer.php-73} # PHP
      - ${bref:layer.console} # The "console" layer

# Exclude files from deployment
package:
  exclude:
    - 'node_modules/**'
    - 'tests/**'
    - 'docker/**'