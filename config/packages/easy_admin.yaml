easy_admin:
  site_name: 'BoxerRatings.com Admin'
  user:
    display_name: true
    display_avatar: false
  design:
    brand_color: 'rgba(137, 11, 17)'
    assets:
      favicon: https://images.boxeratings.com/favicon.ico
  entities:
    Boxer:
      class: App\Entity\Boxer
      label: Boxers
      disabled_actions: ['delete']
      list:
        title: 'Boxers'
        sort: ['division.id', 'ASC']
        fields: ['id', 'name', { property: 'division.name', label: 'Division' }, 'enabled',
                 { property: 'nationality', type: 'country' },
                 { property: 'updated_at', type: 'datetime', label: 'Last Updated'}]
      form:
        fields:
          - { property: 'division', label: 'Division' }
          - name
          - { property: 'dob', label: 'Born', type_options: { widget: 'single_text' } }
          - { property: 'homeTown', label: 'Home Town' }
          - { property: 'boxrecId', label: 'BoxRec.com ID' }
          - { property: 'nationality', type: 'country' }
          - record
          - twitter
          - { property: 'snippet', type: 'text_editor' }
          - enabled
    P4pRating:
      class: App\Entity\P4pRating
      label: Pound For Pound
      list:
        title: Pound For Pound Ratings
        sort: ['rating', 'ASC']
        fields: ['boxer', 'rating', { property: 'updated_at', type: 'datetime', label: 'Last Updated'} ]
      form:
        fields:
          - boxer
          - rating
    BlogPost:
      class: App\Entity\BlogPost
      label: Blog Post
      list:
        title: Blog Posts
        sort: ['createdAt', 'DESC']
        fields: ['title', 'enabled', 'description', { property: 'createdAt', type: 'datetime', label: 'Created'} ]
      form:
        fields:
          - { property: 'type', type: 'choice', type_options:{choices: { Prediction: 'prediction', Opinion: 'opinion', Report: 'report', Profile: 'profile', Feature: 'feature'}} }
          - title
          - subHeading
          - slug
          - description
          - body
          - enabled
